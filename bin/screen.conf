# bin/screen-snapshot の設定（bin/screen.conf として置く。source されるので bash の変数定義だけ書く）
# 値はローカル開発環境のもの。本番の認証情報は書かない。

# ベースURL（テナントや言語の接頭辞まで含める）
SNAP_BASE=http://127.0.0.1:8091

# ログイン方式: form | none | command
#   form    … ログイン画面を GET して CSRF を拾い、ユーザー欄・パスワード欄を POST（Laravel の自前ログイン画面など）
#   none    … ログイン不要（Basic認証なし・公開画面のみ）
#   command … SNAP_COOKIE_COMMAND の標準出力を Cookie ヘッダとして使う（Filament/Livewire などフォーム POST で入れないアプリ）
SNAP_LOGIN_MODE=none
SNAP_LOGIN_PATH=login
SNAP_LOGIN_USER_FIELD=email
SNAP_LOGIN_PASS_FIELD=password
SNAP_LOGIN_TOKEN_FIELD=_token
SNAP_LOGIN_USER=
SNAP_LOGIN_PASS=
SNAP_LOGIN_OK_CODE=302

# command 方式の時だけ。例: php artisan screen:login-cookie 1
SNAP_COOKIE_COMMAND=

# 毎回変わる値を消す追加の sed 式（任意）。例: 's/(data-nonce=")[^"]*/\1/g'
SNAP_NORMALIZE_SED=
